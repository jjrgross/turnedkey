<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Deals | Metro House Pros</title>
  <meta name="description" content="Browse current investment properties available from Metro House Pros LLC in Wisconsin." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f2557;
      --green: #22c55e;
      --light: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--light); color: var(--text); min-height: 100vh; }
    header { background: var(--navy); color: white; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
    header .brand { font-size: 1.25rem; font-weight: 700; }
    header .brand span { color: var(--green); }
    header a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.85rem; }
    header a:hover { color: white; }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--muted); margin-bottom: 32px; font-size: 0.95rem; }
    .deal-count { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .deals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .deal-card { background: white; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--card-shadow); cursor: pointer; text-decoration: none; color: inherit; display: block; transition: transform 0.15s, box-shadow 0.15s; }
    .deal-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
    .deal-img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .deal-img-placeholder { width: 100%; height: 190px; background: linear-gradient(135deg, #1e3a8a 0%, #0f2557 100%); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.25); font-size: 3rem; }
    .deal-body { padding: 16px; }
    .deal-status { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 99px; margin-bottom: 10px; }
    .status-available { background: #dcfce7; color: #15803d; }
    .status-pending   { background: #fef3c7; color: #92400e; }
    .status-sold      { background: #fee2e2; color: #991b1b; }
    .deal-address { font-size: 1rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .deal-price { font-size: 1.25rem; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
    .deal-specs { display: flex; gap: 14px; color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }
    .deal-description { font-size: 0.85rem; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .view-link { display: inline-block; margin-top: 12px; font-size: 0.82rem; color: var(--navy); font-weight: 600; text-decoration: none; }
    .empty-state, .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    @media (max-width: 600px) { h1 { font-size: 1.4rem; } }
  </style>
</head>
<body>
<header>
  <div class="brand">Metro House <span>Pros</span></div>
  <a href="/">metrohousepros.com</a>
</header>
<div class="container">
  <h1>Current Deals</h1>
  <p class="subtitle">Investment properties available now in Wisconsin</p>
  <div id="dealCount" class="deal-count"></div>
  <div id="dealsList"><div class="loading">Loading deals...</div></div>
</div>
<script>
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function statusClass(s) {
    if (s==='Available') return 'status-available';
    if (s==='Pending')   return 'status-pending';
    return 'status-sold';
  }
  async function load() {
    try {
      const deals = await fetch('/api/deals').then(r=>r.json());
      const list = document.getElementById('dealsList');
      const count = document.getElementById('dealCount');
      if (!deals.length) {
        list.innerHTML='<div class="empty-state"><div class="icon">🏠</div><p>No deals available right now. Check back soon!</p></div>';
        return;
      }
      count.textContent = deals.length + ' propert' + (deals.length===1?'y':'ies');
      list.innerHTML='<div class="deals-grid">'+deals.map(d=>`
        <a class="deal-card" href="/deal?id=${esc(d.id)}">
          ${d.imageUrl
            ? `<img class="deal-img" src="${esc(d.imageUrl)}" alt="${esc(d.address)}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
            : ''}
          <div class="deal-img-placeholder"${d.imageUrl?' style="display:none"':''}>🏠</div>
          <div class="deal-body">
            <div class="deal-status ${statusClass(d.status)}">${esc(d.status)}</div>
            <div class="deal-address">${esc(d.address)}</div>
            <div class="deal-price">${esc(d.price)}</div>
            ${(d.beds||d.baths||d.sqft)?`<div class="deal-specs">${d.beds?`<span>🛏 ${esc(d.beds)} bed</span>`:''}${d.baths?`<span>🚿 ${esc(d.baths)} bath</span>`:''}${d.sqft?`<span>📐 ${esc(d.sqft)} sqft</span>`:''}</div>`:''}
            ${d.description?`<div class="deal-description">${esc(d.description)}</div>`:''}
            <span class="view-link">View Details →</span>
          </div>
        </a>`).join('')+'</div>';
    } catch {
      document.getElementById('dealsList').innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>Could not load deals. Please try again.</p></div>';
    }
  }
  load();
</script>
</body>
</html>
