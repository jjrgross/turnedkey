<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="keyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Key design -->
  <circle cx="30" cy="30" r="12" fill="url(#keyGradient)"/>
  <rect x="38" y="26" width="35" height="8" rx="2" fill="url(#keyGradient)"/>
  <rect x="58" y="20" width="4" height="8" rx="1" fill="url(#keyGradient)"/>
  <rect x="66" y="20" width="4" height="8" rx="1" fill="url(#keyGradient)"/>
  
  <!-- Modern touch -->
  <circle cx="30" cy="30" r="5" fill="white"/>
  
  <!-- "TK" letters in modern style -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#keyGradient)">TK</text>
</svg>
