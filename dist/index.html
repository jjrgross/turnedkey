  <script>
    // Intercept form submissions and send to API
    window.addEventListener('DOMContentLoaded', function() {
      // Wait for React to render, then intercept form submissions
      setTimeout(function() {
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
          return originalFetch.apply(this, args);
        };

        // Override console.log to intercept lead submissions
        const originalLog = console.log;
        console.log = function(...args) {
          if (args[0] === 'Lead submitted:' && args[1]) {
            const leadData = args[1];
            // Send to API
            fetch('/api/leads', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(leadData)
            }).then(response => {
              if (response.ok) {
                console.info('✅ Lead saved successfully!');
              } else {
                console.error('❌ Failed to save lead');
              }
            }).catch(err => {
              console.error('❌ Error saving lead:', err);
            });
          }
          return originalLog.apply(this, args);
        };
      }, 1000);
    });
  </script>
