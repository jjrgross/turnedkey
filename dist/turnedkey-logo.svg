<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Key icon -->
  <g transform="translate(10, 30)">
    <circle cx="20" cy="20" r="14" fill="url(#logoGradient)"/>
    <rect x="30" y="15" width="40" height="10" rx="3" fill="url(#logoGradient)"/>
    <rect x="55" y="8" width="5" height="10" rx="1.5" fill="url(#logoGradient)"/>
    <rect x="64" y="8" width="5" height="10" rx="1.5" fill="url(#logoGradient)"/>
    <circle cx="20" cy="20" r="6" fill="white"/>
  </g>
  
  <!-- Company name -->
  <text x="95" y="58" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1e293b">
    TurnedKey
  </text>
  <text x="95" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#64748b">
    PROPERTIES
  </text>
</svg>
